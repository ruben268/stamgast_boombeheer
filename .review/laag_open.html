<!-- ===== Suggestielaag (enkel in -suggesties.html) ===== -->
<style>
  .faq-antwoord{max-height:none!important;padding-bottom:18px!important}
  .sg{background:rgba(244,192,79,.30);box-shadow:inset 0 -2px 0 #d9a21b;border-radius:3px;cursor:pointer;padding:0 2px;position:relative;
      -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s}
  .sg:hover,.sg:focus{background:rgba(244,192,79,.55);outline:none}
  .sg::after{content:attr(data-id);position:relative;top:-.7em;margin-left:3px;font:700 9px/1 Inter,sans-serif;color:#fff;background:#8A5A00;
      border-radius:3px;padding:2px 4px;letter-spacing:.02em;font-style:normal;vertical-align:baseline}
  .sg-A{background:rgba(240,160,140,.28);box-shadow:inset 0 -2px 0 #d08a7a}.sg-A::after{background:#a5523f}
  .sg-O{background:rgba(120,150,230,.22);box-shadow:inset 0 -2px 0 #5a7bd8}
  .sg-O::after{background:#3b5bb5}
  .sg.st-ok{background:rgba(63,174,106,.22);box-shadow:inset 0 -2px 0 #3fae6a}.sg.st-ok::after{background:#1e7a3f;content:attr(data-id) " ✓"}
  .sg.st-nee{background:rgba(140,140,140,.16);box-shadow:inset 0 -2px 0 #999}.sg.st-nee::after{background:#777;content:attr(data-id) " ✗"}
  .sg.st-eigen{background:rgba(90,123,216,.2);box-shadow:inset 0 -2px 0 #5a7bd8}.sg.st-eigen::after{background:#3b5bb5;content:attr(data-id) " ✎"}
  .sg.st-gezien::after{content:attr(data-id) " ●"}
  body.toon-oud .sg:not(.sg-O){background:rgba(240,160,140,.28);box-shadow:inset 0 -2px 0 #d08a7a}
  body{padding-bottom:64px}
  .sv-bar{position:fixed;left:0;right:0;bottom:0;z-index:4000;background:#1e3428;color:#fff;font:13px/1.3 Inter,sans-serif;
      padding:9px 14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
  .sv-bar b{font-weight:600}
  .sv-pag{display:flex;gap:4px;flex-wrap:wrap}
  .sv-pag a{color:#cfe3d4;text-decoration:none;padding:4px 8px;border-radius:6px;white-space:nowrap}
  .sv-pag a span{opacity:.6;font-size:11px}
  .sv-pag a.actief,.sv-pag a:hover{background:rgba(255,255,255,.12);color:#fff}
  .sv-ruimte{flex:1}
  .sv-knop{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:7px;padding:7px 12px;font:600 13px Inter,sans-serif;cursor:pointer}
  .sv-knop:hover{background:rgba(255,255,255,.22)} .sv-knop.prim{background:#E85F2B}.sv-knop.prim:hover{background:#cf5022}
  .sv-pop{position:fixed;inset:0;background:rgba(15,25,18,.55);z-index:5000;display:none;align-items:center;justify-content:center;padding:16px}
  .sv-pop.open{display:flex}
  .sv-card{background:#fff;color:#1a1a1a;border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;
      font:14px/1.55 Inter,sans-serif;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .sv-kop{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .sv-id{font-weight:700;font-size:13px}
  .sv-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:20px;background:#f4ead2;color:#8A5A00}
  .sv-cat.L{background:#e3e9fa;color:#3b5bb5}.sv-cat.A{background:#fbe3dc;color:#a5523f}
  .sv-cat.O{background:#e3e9fa;color:#3b5bb5}
  .sv-x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:#888;line-height:1}
  .sv-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#6b7280;margin:12px 0 5px}
  .sv-blok{border-radius:8px;padding:10px 13px}
  .sv-blok.oud{background:#fbeee9;color:#5b3a30}.sv-blok.nieuw{background:#eaf5ec;color:#1f3d2a}.sv-blok.waarom{background:#f5f5f2;color:#333}
  .sv-blok del{background:#f3cfc3;text-decoration:line-through}.sv-blok ins{background:#c6e6cd;text-decoration:none;font-weight:600}
  .sv-acties{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .sv-acties button{border:1.5px solid #d6d6d0;background:#fff;border-radius:8px;padding:8px 13px;font:600 13px Inter,sans-serif;cursor:pointer;color:#222}
  .sv-acties button.aan[data-a=ok]{background:#2A5C3F;border-color:#2A5C3F;color:#fff}
  .sv-acties button.aan[data-a=nee]{background:#777;border-color:#777;color:#fff}
  .sv-acties button.aan[data-a=eigen]{background:#3b5bb5;border-color:#3b5bb5;color:#fff}
  .sv-card textarea{width:100%;box-sizing:border-box;border:1.5px solid #d6d6d0;border-radius:8px;padding:9px 11px;font:14px/1.5 Inter,sans-serif;min-height:70px;margin-top:6px}
  .sv-nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
  .sv-nav button{background:none;border:0;color:#2A5C3F;font:600 13px Inter,sans-serif;cursor:pointer;padding:4px 0}
  .sv-export pre{white-space:pre-wrap;background:#f5f5f2;border-radius:8px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,monospace;max-height:50vh;overflow:auto}
  @media(max-width:700px){.sv-bar{font-size:12px;padding:7px 10px;gap:6px}.sv-leg,.sv-bar>b,.sv-ruimte{display:none}
    .sv-pag{flex-wrap:nowrap;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}
    .sv-knop{flex:1;padding:7px 8px;font-size:12px}}
</style>

<div class="sv-bar" role="region" aria-label="Open punten">
  <b>Open punten na Lode</b>
  <nav class="sv-pag">{{LINKS}}</nav>
  <span class="sv-ruimte"></span>
  <span class="sv-leg" id="svTeller"></span>
  <button class="sv-knop" id="svToggle" type="button">Toon huidige tekst</button>
  <button class="sv-knop prim" id="svExport" type="button">Beslissingen exporteren</button>
</div>
<div class="sv-pop" id="svPop"><div class="sv-card" id="svCard"></div></div>

<script>
(function(){
  var D={{DATA}}, NAMEN={{NAMEN}}, CATS={{CATS}}, TOT={{TOTAAL}}, KEY='stamgast-openpunten-2026-10';
  var st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  function bewaar(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
  var spans=[].slice.call(document.querySelectorAll('.sg')), ids=spans.map(function(s){return s.dataset.id});
  var oud=false, pop=document.getElementById('svPop'), card=document.getElementById('svCard');
  function txt(h){var d=document.createElement('div');d.innerHTML=h;return (d.textContent||'').replace(/\s+/g,' ').trim()}
  function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function woordDiff(a,b){
    var A=a.split(/(\s+)/),B=b.split(/(\s+)/),n=A.length,m=B.length,L=[];
    for(var i=0;i<=n;i++){L[i]=[];for(var j=0;j<=m;j++)L[i][j]=0}
    for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
    var o='',nw='';i=0;j=0;
    while(i<n&&j<m){if(A[i]===B[j]){o+=esc(A[i]);nw+=esc(B[j]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){o+='<del>'+esc(A[i++])+'</del>'}else{nw+='<ins>'+esc(B[j++])+'</ins>'}}
    while(i<n)o+='<del>'+esc(A[i++])+'</del>';while(j<m)nw+='<ins>'+esc(B[j++])+'</ins>';
    return [o.replace(/<\/del><del>/g,''),nw.replace(/<\/ins><ins>/g,'')];
  }
  function render(){
    var klaar=0;
    spans.forEach(function(s){
      var d=D[s.dataset.id],x=st[s.dataset.id]||{};
      s.classList.remove('st-ok','st-nee','st-eigen','st-gezien');
      if(x.a){s.classList.add('st-'+x.a)} else if(x.opm){s.classList.add('st-gezien')}
      if(d.new_i===null) return;
      var h=d.new_i;
      if(oud||x.a==='nee') h=d.old_i==='(nieuw toegevoegd)'?'<s>'+esc(d.new_i)+'</s>':d.old_i;
      else if(x.a==='eigen'&&x.eigen) h=esc(x.eigen);
      if(s.innerHTML!==h) s.innerHTML=h;
    });
    Object.keys(D).forEach(function(k){var x=st[k];if(x&&(x.a||(D[k].new_i===null&&x.opm!==undefined)))klaar++});
    document.getElementById('svTeller').textContent=klaar+' / '+TOT+' beoordeeld (alle pagina’s)';
  }
  function open(id){
    var d=D[id],x=st[id]||{},i=ids.indexOf(id), h='';
    h+='<div class="sv-kop"><span class="sv-id">'+id+'</span><span class="sv-cat '+d.cat+'">'+CATS[d.cat]+'</span><button class="sv-x" data-k="sluit" aria-label="Sluiten">×</button></div>';
    if(d.new_i===null){
      h+='<div class="sv-lbl">Opmerking</div><div class="sv-blok waarom">'+esc(d.why)+'</div>';
      h+='<div class="sv-lbl">Jouw reactie (optioneel)</div><textarea id="svOpm" placeholder="bv. ok, doe ik later / weglaten">'+esc(x.opm||'')+'</textarea>';
      h+='<div class="sv-acties"><button data-a="gezien" class="aan">Gezien</button></div>';
    } else {
      var df=woordDiff(txt(d.old_i),txt(d.new_i));
      if(d.old_i==='(nieuw toegevoegd)') df=['<i>(nog niet aanwezig)</i>','<ins>'+esc(d.new_i)+'</ins>'];
      h+='<div class="sv-lbl">Nu op de site</div><div class="sv-blok oud">'+df[0]+'</div>';
      h+='<div class="sv-lbl">Voorstel Lode</div><div class="sv-blok nieuw">'+df[1]+'</div>';
      h+='<div class="sv-lbl">Reactie Lode &amp; advies</div><div class="sv-blok waarom">'+esc(d.why)+'</div>';
      h+='<div class="sv-acties">'+
        '<button data-a="ok" class="'+(x.a==='ok'?'aan':'')+'">✓ Voorstel Lode overnemen</button>'+
        '<button data-a="nee" class="'+(x.a==='nee'?'aan':'')+'">✗ Huidige tekst houden</button>'+
        '<button data-a="eigen" class="'+(x.a==='eigen'?'aan':'')+'">✎ Eigen versie</button></div>';
      h+='<div id="svEigenW" style="display:'+(x.a==='eigen'?'block':'none')+'"><div class="sv-lbl">Eigen versie</div><textarea id="svEigen">'+esc(x.eigen||txt(d.new_i))+'</textarea></div>';
      h+='<div class="sv-lbl">Opmerking (optioneel)</div><textarea id="svOpm" style="min-height:44px">'+esc(x.opm||'')+'</textarea>';
    }
    h+='<div class="sv-nav"><button data-k="vorige" '+(i<=0?'style="visibility:hidden"':'')+'>← Vorige</button><button data-k="volgende">'+(i<ids.length-1?'Volgende →':'Sluiten')+'</button></div>';
    card.innerHTML=h; card.dataset.id=id; pop.classList.add('open');
    var s=document.querySelector('.sg[data-id="'+id+'"]'); if(s) s.scrollIntoView({block:'center',behavior:'smooth'});
  }
  function opslaan(){
    var id=card.dataset.id; if(!id||!pop.classList.contains('open'))return;
    var x=st[id]||{}, o=document.getElementById('svOpm'), e=document.getElementById('svEigen');
    if(o) x.opm=o.value.trim(); if(e&&x.a==='eigen') x.eigen=e.value.trim();
    if(D[id].new_i===null && x.opm===undefined) x.opm='';
    st[id]=x; bewaar(); render();
  }
  function sluit(){opslaan();pop.classList.remove('open')}
  card.addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b)return; var id=card.dataset.id, x=st[id]||{};
    if(b.dataset.a){
      if(b.dataset.a==='gezien'){x.opm=(document.getElementById('svOpm').value||'').trim();st[id]=x;bewaar();render();return sluit()}
      x.a=(x.a===b.dataset.a)?undefined:b.dataset.a; st[id]=x;
      card.querySelectorAll('.sv-acties button').forEach(function(k){k.classList.toggle('aan',k.dataset.a===x.a)});
      document.getElementById('svEigenW').style.display=x.a==='eigen'?'block':'none';
      opslaan(); return;
    }
    if(b.dataset.k==='sluit') return sluit();
    var i=ids.indexOf(id);
    if(b.dataset.k==='vorige'){opslaan();open(ids[i-1])}
    if(b.dataset.k==='volgende'){opslaan(); i<ids.length-1?open(ids[i+1]):sluit()}
  });
  card.addEventListener('input',function(){opslaan()});
  pop.addEventListener('click',function(e){if(e.target===pop)sluit()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&pop.classList.contains('open'))sluit()});
  spans.forEach(function(s){
    function act(e){e.preventDefault();e.stopPropagation();open(s.dataset.id)}
    s.addEventListener('click',act,true);
    s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')act(e)});
  });
  document.getElementById('svToggle').onclick=function(){
    oud=!oud; document.body.classList.toggle('toon-oud',oud);
    this.textContent=oud?'Toon voorstellen':'Toon huidige tekst'; render();
  };
  document.getElementById('svExport').onclick=function(){
    var r=[],pag='';
    Object.keys(D).forEach(function(k){
      var d=D[k],x=st[k]||{},l;
      if(d.page!==pag){pag=d.page;r.push('\n## '+NAMEN[pag])}
      if(d.new_i===null) l=k+' OPMERKING'+(x.opm!==undefined?' — gezien':' — nog niet bekeken');
      else l=k+' '+(x.a==='ok'?'VOORSTEL LODE':x.a==='nee'?'HUIDIGE TEKST HOUDEN':x.a==='eigen'?'EIGEN VERSIE: "'+(x.eigen||'')+'"':'— nog niet beoordeeld');
      if(x.opm) l+='\n    opmerking: '+x.opm;
      r.push(l);
    });
    var t='Open punten Stamgast — beslissingen'+r.join('\n');
    card.dataset.id=''; card.innerHTML='<div class="sv-kop"><span class="sv-id">Beslissingen exporteren</span><button class="sv-x" data-k="sluit">×</button></div>'+
      '<p style="margin:0 0 10px">Kopieer deze lijst en plak ze in de chat, dan voer ik alles door.</p><div class="sv-export"><pre id="svTxt"></pre></div>'+
      '<div class="sv-acties"><button id="svKopieer">Kopiëren</button></div>';
    document.getElementById('svTxt').textContent=t; pop.classList.add('open');
    document.getElementById('svKopieer').onclick=function(){var me=this;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){me.textContent='Gekopieerd ✓'},function(){
        var rg=document.createRange();rg.selectNodeContents(document.getElementById('svTxt'));var sl=getSelection();sl.removeAllRanges();sl.addRange(rg);me.textContent='Geselecteerd — Ctrl/Cmd+C'})};
  };
  render();
})();
</script>
